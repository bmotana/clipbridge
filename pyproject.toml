[project]
name = "clipbridge"
version = "0.1.0"
description = "A small Flask service for updating a machine's clipboard over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "Flask>=3.0,<4.0",
    "pyperclip>=1.9,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-flask>=1.3,<2.0",
]

[project.scripts]
clipbridge = "clipbridge.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
